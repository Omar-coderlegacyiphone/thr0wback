name: build-deb

# Builds the on-device Thr0wback .deb from public-source components and uploads
# it as an artifact. No Apple firmware is fetched, built, or shipped here — the
# .deb carries only the open-source booter (kloader) and the launcher script.
# Each user supplies their own firmware on-device (see docs/on-device.md).

on:
  push:
    branches: [ "**" ]
    paths: [ "packaging/**", ".github/workflows/build-deb.yml" ]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot

      # kloader is the open-source on-device loader. Building it needs an iOS
      # ARM toolchain (theos + an iOS SDK). That toolchain setup is the one
      # remaining wiring step; until it's in place this job fails loudly here
      # rather than shipping a .deb with no loader.
      - name: Build kloader (iOS ARM)  # TODO: wire up theos + iOS SDK
        run: |
          echo "::error::kloader build not wired up yet — see docs/on-device.md"
          exit 1
          # mkdir -p packaging/deb/usr/bin
          # cp "$KLOADER_BIN" packaging/deb/usr/bin/kloader

      - name: Assemble .deb
        run: |
          chmod 0755 packaging/deb/usr/bin/thr0wback
          chmod 0755 packaging/deb/DEBIAN
          fakeroot dpkg-deb --build packaging/deb thr0wback.deb
          dpkg-deb --info thr0wback.deb
          dpkg-deb --contents thr0wback.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: thr0wback-deb
          path: thr0wback.deb
