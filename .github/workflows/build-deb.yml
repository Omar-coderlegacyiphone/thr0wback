name: build-deb

# Builds the on-device Thr0wback .deb from public-source components and uploads
# it as an artifact. No Apple firmware is fetched, built, or shipped here — the
# .deb carries only the open-source booter (kloader) and the launcher script.
# Each user supplies their own firmware on-device (see docs/on-device.md).
#
# kloader comes from axi0mX's ios-kexec-utils (github.com/axi0mX/ios-kexec-utils,
# winocm's original + axi0mX's iOS 4.0-9.3.5 armv7 support). That repo ships a
# prebuilt universal (armv7+arm64) binary already signed with the tfp0
# entitlement it needs, so CI uses that directly — rebuilding from kloader.c
# needs Xcode + an iPhoneOS SDK + ldid, which only run on macOS, not this
# Ubuntu runner.

on:
  push:
    paths: [ "packaging/**", ".github/workflows/build-deb.yml" ]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install base tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot file

      - name: Fetch kloader from axi0mX/ios-kexec-utils
        run: |
          set -x
          git clone --depth 1 https://github.com/axi0mX/ios-kexec-utils.git /tmp/kexec-utils
          echo "=== repo tree ==="; ls -la /tmp/kexec-utils
          echo "=== kloader binary ==="; file /tmp/kexec-utils/kloader

      - name: Verify it's the expected universal armv7/arm64 Mach-O
        run: |
          set -x
          FILE_OUT="$(file -b /tmp/kexec-utils/kloader)"
          echo "$FILE_OUT"
          case "$FILE_OUT" in
            *"Mach-O universal"*armv7*) ;;
            *) echo "unexpected binary format — not packaging it"; exit 1 ;;
          esac

      - name: Assemble .deb (iOS 4.1-compatible format)
        run: |
          set -x
          cp /tmp/kexec-utils/kloader packaging/deb/usr/bin/kloader
          chmod 0755 packaging/deb/usr/bin/kloader packaging/deb/usr/bin/thr0wback

          # Manual .deb creation for iOS 4.1 compatibility.
          # Old dpkg (from ~2010) doesn't understand modern dpkg-deb format.
          # Build as a simple ar archive: debian-binary + control.tar.gz + data.tar.gz

          mkdir -p /tmp/deb-build
          cd /tmp/deb-build

          # 1. debian-binary (version marker for old dpkg)
          echo -n "2.0" > debian-binary

          # 2. control.tar (control metadata, uncompressed for maximum compatibility)
          tar -C "$GITHUB_WORKSPACE/packaging/deb" -cf control.tar DEBIAN/
          gzip -9 control.tar

          # 3. data.tar (actual file contents)
          tar -C "$GITHUB_WORKSPACE/packaging/deb" -cf data.tar usr/
          gzip -9 data.tar

          # 4. Assemble as ar archive (Debian package format)
          # Old ar/dpkg expects this exact order
          ar r thr0wback.deb debian-binary control.tar.gz data.tar.gz

          # Verify
          ar t thr0wback.deb
          file thr0wback.deb

          # Copy to repo root
          cp thr0wback.deb "$GITHUB_WORKSPACE/thr0wback.deb"

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thr0wback-deb
          path: thr0wback.deb
          if-no-files-found: ignore
